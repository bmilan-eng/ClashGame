<section id="3D-graphics">
  <h2>3D Graphics</h2>
  <p>We have updated the loading mechanism for our GLB models to ensure they appear smoothly without any black screen issues. The following code snippet illustrates the improvements made in the rendering process:</p>
  <script>
    // Improved 3D model loading
    const loader = new THREE.GLTFLoader();
    loader.load('path/to/model.glb', function (gltf) {
      const model = gltf.scene;
      scene.add(model);
      // Perform necessary transformations and adjustments
      model.position.set(0, 0, 0);
      model.scale.set(1, 1, 1);
      // Ensure visibility and lighting are optimal
      model.traverse((node) => {
        if (node.isMesh) {
          node.material.transparent = false;
        }
      });
    }, undefined, function (error) {
      console.error('An error occurred while loading the GLB model:', error);
    });
  </script>
</section>
