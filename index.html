<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Clash 3D - Ultimate Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --gold: #FFD700; --elixir: #ff00ff; --blue: #2196F3; --red: #F44336; --dark: #121212; --purple: #a55eea; }
        body { margin: 0; overflow: hidden; font-family: 'Verdana', sans-serif; background: #000; color: white; user-select: none; }

        .screen {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, #2c3e50, #000);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: 0.5s;
        }
        .hidden { display: none !important; }

        .panel {
            background: rgba(0,0,0,0.9); padding: 30px; border-radius: 25px;
            border: 3px solid var(--gold); text-align: center; width: 350px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        input {
            padding: 12px; width: 85%; border-radius: 10px; border: 2px solid #444;
            margin: 8px 0; font-size: 1rem; text-align: center; background: #222; color: white;
        }
        
        .btn {
            padding: 15px 25px; border-radius: 12px; border: none; cursor: pointer;
            font-weight: bold; text-transform: uppercase; margin: 8px 0; width: 100%;
            transition: 0.2s; box-shadow: 0 4px 0 rgba(0,0,0,0.4);
        }
        .btn-green { background: linear-gradient(#2ecc71, #27ae60); color: white; }
        .btn-blue { background: linear-gradient(#3498db, #2980b9); color: white; }
        .btn-red { background: linear-gradient(#e74c3c, #c0392b); color: white; }
        .btn-purple { background: linear-gradient(#a55eea, #8854d0); color: white; }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.4); }

        #screen-lobby { background: linear-gradient(135deg, #1a2a3a 0%, #000 100%); flex-direction: row; align-items: stretch; }
        .sidebar { width: 280px; background: rgba(0,0,0,0.6); border-right: 2px solid var(--gold); padding: 20px; display: flex; flex-direction: column; }
        .main-content { flex: 1; padding: 20px; display: flex; flex-direction: column; }
        
        .stat-bar { background: #000; padding: 10px 20px; border-radius: 30px; border: 2px solid #333; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 10px; background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; overflow-y: auto; }
        .item-card { background: #222; padding: 10px; border-radius: 10px; text-align: center; cursor: pointer; border: 2px solid transparent; display: flex; flex-direction: column; gap: 5px; }
        .item-card.active { border-color: var(--gold); background: #332a00; }
        .stats-text { font-size: 0.75rem; color: #ddd; background: #111; padding: 2px; border-radius: 5px; }

        /* Estilos Pase de Batalla */
        #bp-modal {
            position: fixed; top: 10%; left: 10%; width: 80%; height: 80%;
            background: rgba(20, 20, 20, 0.95); border: 4px solid var(--purple);
            border-radius: 20px; z-index: 600; display: none; padding: 20px; flex-direction: column;
        }
        .bp-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; overflow-y: auto; padding: 10px; }
        .bp-lvl { background: #333; padding: 10px; border-radius: 10px; text-align: center; border: 2px solid #444; position: relative; }
        .bp-lvl.unlocked { border-color: var(--gold); background: #443a1a; }
        .bp-lvl.claimed { opacity: 0.5; }

        #admin-modal, #box-modal { 
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #222; padding: 30px; border: 4px solid var(--gold); 
            border-radius: 20px; z-index: 700; display: none; width: 320px; text-align: center;
        }

        #game-ui { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
        .hp-bar-container { position: absolute; width: 50px; height: 6px; background: rgba(0,0,0,0.5); border: 1px solid #fff; border-radius: 3px; transform: translate(-50%, -50%); }
        .hp-bar-fill { height: 100%; width: 100%; transition: width 0.2s; }
        
        #hud-bottom { position: absolute; bottom: 0; width: 100%; height: 160px; background: linear-gradient(transparent, rgba(0,0,0,0.9)); display: flex; flex-direction: column; align-items: center; pointer-events: auto; }
        #elixir-wrapper { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        #elixir-num { font-size: 1.5rem; font-weight: bold; color: var(--elixir); }
        #elixir-container { width: 300px; height: 16px; background: #111; border: 2px solid #fff; border-radius: 10px; overflow: hidden; }
        #elixir-fill { height: 100%; width: 0%; background: var(--elixir); }
        #hand { display: flex; gap: 10px; margin-top: 10px; }
        .card { width: 75px; height: 100px; background: white; border-radius: 8px; color: black; border: 3px solid #444; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
        
        #quit-btn { position: absolute; top: 20px; right: 20px; padding: 10px 20px; background: var(--red); color: white; border: 2px solid white; border-radius: 10px; font-weight: bold; cursor: pointer; pointer-events: auto; z-index: 100; box-shadow: 0 4px 0 #800; }
    </style>
</head>
<body>

    <div id="screen-login" class="screen">
        <div class="panel">
            <h1 style="margin:0">MINI CLASH <span style="color:var(--gold)">3D</span></h1>
            <p style="font-size: 0.8rem; color: #aaa;">Inicia sesión o regístrate</p>
            <input type="email" id="auth-email" placeholder="Correo Electrónico">
            <input type="text" id="auth-nick" placeholder="Nickname">
            <input type="password" id="auth-pass" placeholder="Contraseña">
            <button class="btn btn-green" onclick="handleAuth('login')">ENTRAR</button>
            <button class="btn btn-blue" onclick="handleAuth('register')">REGISTRARSE</button>
        </div>
    </div>

    <div id="screen-lobby" class="screen hidden">
        <div class="sidebar">
            <h2 style="color:var(--gold); text-align: center;">MENÚ</h2>
            <button class="btn btn-green" onclick="startSoloGame()">⚔️ JUGAR (IA)</button>
            <input type="text" id="friend-id" placeholder="Nick de amigo...">
            <button class="btn btn-blue" onclick="connectToFriend()">🤝 INVITAR</button>
            <div style="flex:1"></div>
            <button id="admin-btn" class="btn btn-red hidden" onclick="toggleAdmin(true)">⚙️ ADMIN PANEL</button>
            <button class="btn btn-red" onclick="logout()">SALIR</button>
        </div>

        <div class="main-content">
            <div class="stat-bar">
                <span>💰 <b id="stat-gold">0</b></span>
                <div style="display:flex; align-items:center; gap:10px;">
                    <span>👤 <b id="display-user">?</b></span>
                    <button class="btn btn-purple" style="margin:0; padding: 5px 15px; width:auto;" onclick="toggleBP(true)">🎫 PASE</button>
                </div>
                <span>🏆 <b id="stat-wins">0</b></span>
            </div>
            <div style="flex:1; display:flex; gap:20px; overflow:hidden;">
                <div style="flex:1; display:flex; flex-direction:column;">
                    <h3>🛒 TIENDA</h3>
                    <div id="shop-grid" class="grid"></div>
                </div>
                <div style="flex:1; display:flex; flex-direction:column;">
                    <h3>🎴 TU MAZO</h3>
                    <div id="deck-grid" class="grid"></div>
                </div>
                <div style="flex:1; display:flex; flex-direction:column;">
                    <h3>🆙 MEJORAR (MÁX 5)</h3>
                    <div id="upgrade-grid" class="grid"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="bp-modal">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="color:var(--purple); margin:0;">BATTLE PASS (NIVEL <span id="bp-lvl-val">1</span>)</h2>
            <div id="bp-xp-val">XP: 0/50</div>
            <button class="btn btn-red" style="width:auto; margin:0;" onclick="toggleBP(false)">CERRAR</button>
        </div>
        <hr style="border:1px solid #333; width:100%; margin:15px 0;">
        <div id="bp-list" class="bp-container"></div>
    </div>

    <div id="box-modal">
        <h2 id="box-title">🎁 CAJA SORPRESA</h2>
        <div id="box-content"></div>
        <div id="box-action" style="margin-top:20px;"></div>
    </div>

    <div id="admin-modal">
        <h2 style="margin:0; color:var(--gold)">ADMIN TOOLS</h2>
        <button class="btn btn-green" onclick="executeAdminGift(true)">DARME +10.000 ORO</button>
        <button class="btn btn-red" onclick="toggleAdmin(false)">CERRAR</button>
    </div>

    <div id="game-ui" class="hidden">
        <button id="quit-btn" onclick="quitMatch()">SALIR DE PARTIDA</button>
        <div id="hp-bars-layer"></div>
        <div id="hud-bottom">
            <div id="elixir-wrapper">
                <div id="elixir-num">0</div>
                <div id="elixir-container"><div id="elixir-fill"></div></div>
            </div>
            <div id="hand"></div>
        </div>
    </div>

<script>
let currentUser = null;
let peer = null, conn = null, isMultiplayer = false;
let particles = [];

// --- SISTEMA DE CUENTAS ---
window.onload = () => {
    const activeUser = localStorage.getItem('CLASH_ACTIVE_SESSION');
    if(activeUser) {
        let db = JSON.parse(localStorage.getItem('CLASH_DB_SECURE') || '{}');
        if(db[activeUser]) {
            currentUser = db[activeUser];
            initBPData();
            enterLobby();
        }
    }
};

function initBPData() {
    if(!currentUser.levels) currentUser.levels = {};
    if(currentUser.bpLevel === undefined) currentUser.bpLevel = 1;
    if(currentUser.bpXP === undefined) currentUser.bpXP = 0;
    if(!currentUser.bpClaimed) currentUser.bpClaimed = [];
}

function handleAuth(mode) {
    const email = document.getElementById('auth-email').value.trim().toLowerCase();
    const nick = document.getElementById('auth-nick').value.trim();
    const pass = document.getElementById('auth-pass').value;
    if(!email || !pass || (mode==='register' && !nick)) return alert("Faltan datos");
    let db = JSON.parse(localStorage.getItem('CLASH_DB_SECURE') || '{}');

    if(mode === 'register') {
        if(db[nick]) return alert("Nickname ya en uso");
        db[nick] = { email, nick, pass, gold: 1000, wins: 0, owned: [0,1,2,3], deck: [0,1,2,3], levels: {}, bpLevel: 1, bpXP: 0, bpClaimed: [] };
        localStorage.setItem('CLASH_DB_SECURE', JSON.stringify(db));
        alert("¡Registro con éxito!");
    } else {
        const user = db[nick];
        if(user && user.pass === pass && user.email === email) {
            currentUser = user;
            initBPData();
            localStorage.setItem('CLASH_ACTIVE_SESSION', currentUser.nick);
            enterLobby();
        } else { alert("Datos incorrectos"); }
    }
}

function logout() { localStorage.removeItem('CLASH_ACTIVE_SESSION'); location.reload(); }

function enterLobby() {
    document.getElementById('screen-login').classList.add('hidden');
    document.getElementById('screen-lobby').classList.remove('hidden');
    document.getElementById('display-user').innerText = currentUser.nick;
    if(currentUser.email === "milanbiel12@gmail.com") document.getElementById('admin-btn').classList.remove('hidden');
    updateUI();
    const peerId = currentUser.nick.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
    peer = new Peer(peerId);
    peer.on('connection', c => { conn = c; setupConnection(); });
}

function save() {
    let db = JSON.parse(localStorage.getItem('CLASH_DB_SECURE') || '{}');
    db[currentUser.nick] = currentUser;
    localStorage.setItem('CLASH_DB_SECURE', JSON.stringify(db));
}

function updateUI() {
    document.getElementById('stat-gold').innerText = currentUser.gold;
    document.getElementById('stat-wins').innerText = currentUser.wins;
    renderGrids();
}

// --- LOGICA DEL PASE DE BATALLA ---
function toggleBP(show) {
    const modal = document.getElementById('bp-modal');
    modal.style.display = show ? 'flex' : 'none';
    if(show) renderBP();
}

function renderBP() {
    document.getElementById('bp-lvl-val').innerText = currentUser.bpLevel;
    document.getElementById('bp-xp-val').innerText = `XP: ${currentUser.bpXP}/50`;
    const list = document.getElementById('bp-list');
    list.innerHTML = '';

    for(let i=1; i<=50; i++) {
        const isBox = i % 5 === 0; // Cajas cada 5 niveles para que sean menos
        const unlocked = currentUser.bpLevel >= i;
        const claimed = currentUser.bpClaimed.includes(i);
        const div = document.createElement('div');
        div.className = `bp-lvl ${unlocked ? 'unlocked' : ''} ${claimed ? 'claimed' : ''}`;
        div.innerHTML = `
            <small>Lvl ${i}</small>
            <div style="font-size:1.8rem; margin:5px 0;">${isBox ? '🎁' : '💰'}</div>
            ${unlocked && !claimed ? `<button class="btn btn-green" style="font-size:0.6rem; padding:5px;" onclick="claimReward(${i})">OBTENER</button>` : ''}
            ${claimed ? '✅' : ''}
        `;
        list.appendChild(div);
    }
}

function claimReward(lvl) {
    if(currentUser.bpClaimed.includes(lvl)) return;
    
    if(lvl % 5 === 0) {
        openBox();
    } else {
        const gold = 200;
        currentUser.gold += gold;
        alert(`¡Has recibido ${gold} monedas!`);
    }

    currentUser.bpClaimed.push(lvl);
    
    // Reiniciar pase al completar el 50
    if(lvl === 50) {
        alert("¡Pase completado! Se reiniciará.");
        currentUser.bpLevel = 1;
        currentUser.bpXP = 0;
        currentUser.bpClaimed = [];
    }
    
    save(); updateUI(); renderBP();
}

function openBox() {
    const modal = document.getElementById('box-modal');
    const content = document.getElementById('box-content');
    const action = document.getElementById('box-action');
    modal.style.display = 'block';
    action.innerHTML = '';

    // Probabilidad: Oro (55%) vs Mejora (45%) -> Oro tiene 10% más
    const roll = Math.random();
    if(roll < 0.55) {
        const amount = Math.floor(Math.random() * 901) + 100; // Máximo 1000
        content.innerHTML = `<h3>💰 ¡DINERO!</h3><p>Has ganado ${amount} monedas.</p>`;
        currentUser.gold += amount;
        action.innerHTML = `<button class="btn btn-blue" onclick="closeBox()">OK</button>`;
    } else {
        content.innerHTML = `<h3>🆙 ¡MEJORA!</h3><p>Elige un personaje de tu mazo para subirlo +1 nivel:</p>`;
        const grid = document.createElement('div');
        grid.style.display = 'grid'; grid.style.gridTemplateColumns = '1fr 1fr'; grid.style.gap = '5px';
        
        currentUser.owned.forEach(id => {
            const c = CHARS_DB[id];
            const lvl = currentUser.levels[id] || 0;
            if(lvl < 5) {
                const b = document.createElement('button');
                b.className = 'btn btn-purple'; b.style.fontSize = '0.7rem';
                b.innerText = `${c.emoji} Lvl ${lvl} -> ${lvl+1}`;
                b.onclick = () => {
                    currentUser.levels[id] = lvl + 1;
                    alert(`${c.name} ahora es nivel ${lvl+1}`);
                    closeBox();
                };
                grid.appendChild(b);
            }
        });
        content.appendChild(grid);
        if(grid.children.length === 0) {
            content.innerHTML = "<p>¡Todos están al máximo! Recibes 1000 monedas.</p>";
            currentUser.gold += 1000;
            action.innerHTML = `<button class="btn btn-blue" onclick="closeBox()">OK</button>`;
        }
    }
    save(); updateUI();
}

function closeBox() { document.getElementById('box-modal').style.display = 'none'; }

// --- RESTO DEL JUEGO (MANTENIENDO GRÁFICOS) ---
const CHARS_DB = [];
const types = ["Guerrero", "Arquero", "Gigante", "Mago", "Caballero", "Bárbaro"];
const icons = ["⚔️", "🏹", "🧔", "🔥", "🛡️", "🪓"];
for(let i=0; i<50; i++) {
    const t = i % types.length;
    CHARS_DB.push({
        id: i, name: types[t], emoji: icons[t],
        hp: 120 + (i*15), dmg: 25 + (i*5), cost: 2 + (i%4), speed: 2 + Math.random(),
        price: i * 200, color: new THREE.Color().setHSL((i*0.13)%1, 0.7, 0.5).getHex()
    });
}

function renderGrids() {
    const shop = document.getElementById('shop-grid'); shop.innerHTML = '';
    const deck = document.getElementById('deck-grid'); deck.innerHTML = '';
    const upg = document.getElementById('upgrade-grid'); upg.innerHTML = '';
    
    CHARS_DB.forEach(c => {
        const owned = currentUser.owned.includes(c.id);
        const div = document.createElement('div');
        div.className = `item-card ${owned ? 'active' : ''}`;
        div.innerHTML = `<div style="font-size:1.5rem">${c.emoji}</div><div class="stats-text">❤️${c.hp} | ⚔️${c.dmg}</div><small>${owned ? 'COMPRADO' : '💰'+c.price}</small>`;
        div.onclick = () => { if(!owned && currentUser.gold >= c.price) { currentUser.gold -= c.price; currentUser.owned.push(c.id); save(); updateUI(); }};
        shop.appendChild(div);
    });

    currentUser.owned.forEach(id => {
        const c = CHARS_DB[id];
        const inDeck = currentUser.deck.includes(id);
        const div = document.createElement('div');
        div.className = `item-card ${inDeck ? 'active' : ''}`;
        div.innerHTML = `<div style="font-size:1.5rem">${c.emoji}</div><div class="stats-text">❤️${c.hp} | ⚔️${c.dmg}</div><small>${inDeck ? 'MAZO' : 'USAR'}</small>`;
        div.onclick = () => { if(!inDeck) { if(currentUser.deck.length >= 4) currentUser.deck.shift(); currentUser.deck.push(id); save(); updateUI(); }};
        deck.appendChild(div);

        const lvl = currentUser.levels[id] || 0;
        const upgradeCost = (lvl + 1) * 500;
        const isMax = lvl >= 5;
        const uDiv = document.createElement('div');
        uDiv.className = 'item-card';
        uDiv.innerHTML = `<div style="font-size:1.1rem">${c.emoji} Lvl ${lvl}</div><div class="stats-text">${isMax ? 'NIVEL MÁX' : '💰'+upgradeCost}</div>`;
        uDiv.onclick = () => {
            if(isMax) return alert("Nivel máximo 5");
            if(currentUser.gold >= upgradeCost) { currentUser.gold -= upgradeCost; currentUser.levels[id] = lvl + 1; save(); updateUI(); }
        };
        upg.appendChild(uDiv);
    });
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 32, 28); camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);
const ambient = new THREE.AmbientLight(0xffffff, 0.65);
const sun = new THREE.DirectionalLight(0xffffee, 1.2);
sun.position.set(10, 30, 15); scene.add(ambient, sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(46, 26), new THREE.MeshStandardMaterial({ color: 0x4aa144 }));
ground.rotation.x = -Math.PI/2; scene.add(ground);

let towers = { player: null, enemy: null }, troops = [], gameActive = false, elixir = 0;

function createTower(x, color, isPlayer) {
    const group = new THREE.Group();
    const base = new THREE.Mesh(new THREE.BoxGeometry(3.5, 3.5, 3.5), new THREE.MeshStandardMaterial({color: 0xbdc3c7}));
    base.position.y = 1.75; group.add(base); group.position.set(x, 0, 0); scene.add(group);
    const bar = document.createElement('div');
    bar.className = 'hp-bar-container';
    bar.innerHTML = `<div class="hp-bar-fill" style="background:${isPlayer ? 'var(--blue)' : 'var(--red)'}"></div>`;
    document.getElementById('hp-bars-layer').appendChild(bar);
    return { mesh: group, hp: isPlayer ? 5000 : 2000, maxHp: isPlayer ? 5000 : 2000, bar, x };
}

function startMatch() {
    document.getElementById('screen-lobby').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    document.getElementById('hp-bars-layer').innerHTML = '';
    troops.forEach(t => { scene.remove(t.mesh); t.bar.remove(); });
    troops = [];
    if(towers.player) { scene.remove(towers.player.mesh); scene.remove(towers.enemy.mesh); }
    towers.player = createTower(-16, 0x2196F3, true);
    towers.enemy = createTower(16, 0xF44336, false);
    gameActive = true; elixir = 5;
    renderHand(); animate();
}

function startSoloGame() { isMultiplayer = false; startMatch(); }
function quitMatch() { gameActive = false; document.getElementById('game-ui').classList.add('hidden'); document.getElementById('screen-lobby').classList.remove('hidden'); updateUI(); }

function spawnUnit(id, owner, z) {
    const c = CHARS_DB[id];
    const lvl = currentUser.levels[id] || 0;
    const mult = 1 + (lvl * 0.15);
    const mesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.35, 0.5), new THREE.MeshStandardMaterial({color: c.color}));
    mesh.position.set(owner === 'player' ? -14 : 14, 0.6, z);
    scene.add(mesh);
    const bar = document.createElement('div');
    bar.className = 'hp-bar-container';
    bar.innerHTML = `<div class="hp-bar-fill" style="background:${owner === 'player' ? 'var(--blue)' : 'var(--red)'}"></div>`;
    document.getElementById('hp-bars-layer').appendChild(bar);
    troops.push({ ...c, owner, mesh, bar, hp: c.hp * mult, maxHp: c.hp * mult, currentDmg: (c.dmg * mult) });
}

function renderHand() {
    const h = document.getElementById('hand'); h.innerHTML = '';
    currentUser.deck.forEach(id => {
        const c = CHARS_DB[id];
        const d = document.createElement('div');
        d.className = 'card';
        d.innerHTML = `<span style="color:var(--elixir)">💧${c.cost}</span><div>${c.emoji}</div>`;
        d.onclick = () => { if(elixir >= c.cost) { spawnUnit(id, 'player', (Math.random()-0.5)*8); elixir -= c.cost; }};
        h.appendChild(d);
    });
}

function animate() {
    if(!gameActive) return;
    requestAnimationFrame(animate);
    const dt = 0.016;
    elixir = Math.min(10, elixir + dt * 0.7);
    document.getElementById('elixir-fill').style.width = (elixir * 10) + "%";
    document.getElementById('elixir-num').innerText = Math.floor(elixir);

    if(!isMultiplayer && Math.random() < 0.0035) spawnUnit(Math.floor(Math.random()*6), 'enemy', (Math.random()-0.5)*8);

    for(let i = troops.length-1; i>=0; i--) {
        const t = troops[i];
        if(t.hp <= 0) { scene.remove(t.mesh); t.bar.remove(); troops.splice(i,1); continue; }
        const tow = t.owner === 'player' ? towers.enemy : towers.player;
        if(Math.abs(t.mesh.position.x - tow.x) < 2) tow.hp -= t.currentDmg * dt;
        else t.mesh.position.x += (t.owner === 'player' ? 1 : -1) * t.speed * dt;
        updateBar(t.mesh.position, t.bar, t.hp/t.maxHp);
    }

    updateBar(new THREE.Vector3(towers.player.x, 6, 0), towers.player.bar, towers.player.hp/towers.player.maxHp);
    updateBar(new THREE.Vector3(towers.enemy.x, 6, 0), towers.enemy.bar, towers.enemy.hp/towers.enemy.maxHp);
    if(towers.enemy.hp <= 0) endMatch(true);
    if(towers.player.hp <= 0) endMatch(false);
    renderer.render(scene, camera);
}

function updateBar(pos3d, bar, pct) {
    const v = pos3d.clone().project(camera);
    bar.style.left = (v.x * 0.5 + 0.5) * window.innerWidth + "px";
    bar.style.top = (-(v.y * 0.5 - 0.5) * window.innerHeight) - 40 + "px";
    bar.firstChild.style.width = Math.max(0, pct * 100) + "%";
}

function endMatch(win) {
    gameActive = false;
    if(win) {
        currentUser.gold += 500; currentUser.wins++;
        currentUser.bpXP += 5; // 5 XP por victoria
        if(currentUser.bpXP >= 50 && currentUser.bpLevel < 50) {
            currentUser.bpXP = 0;
            currentUser.bpLevel++;
            alert("¡Nivel de Pase de Batalla aumentado!");
        }
        alert("¡VICTORIA! +500 Monedas / +5 XP");
    } else { alert("DERROTA"); }
    save();
    document.getElementById('game-ui').classList.add('hidden');
    document.getElementById('screen-lobby').classList.remove('hidden');
    updateUI();
}

function toggleAdmin(show) { document.getElementById('admin-modal').style.display = show ? 'block' : 'none'; }
function executeAdminGift(self) { if(self) { currentUser.gold += 10000; save(); updateUI(); alert("¡Oro recibido!"); } }
</script>
