<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Clash 3D - Local & Peer Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --gold: #FFD700; --blue: #2196F3; --dark: #1a1a1a;
            --clash-gradient: linear-gradient(180deg, #5c92ff 0%, #2955a3 100%);
        }

        body { margin: 0; font-family: 'Verdana', sans-serif; background: #000; color: white; overflow: hidden; }

        /* --- LOGIN SIMULADO --- */
        .screen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; z-index: 10; transition: 0.5s; }
        #auth-screen { background: radial-gradient(circle, #2c3e50, #000); align-items: center; justify-content: center; }
        .auth-box { background: rgba(0,0,0,0.9); padding: 30px; border-radius: 20px; border: 3px solid var(--gold); width: 300px; text-align: center; }
        input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #333; color: white; }
        
        /* --- LOBBY PREMIUM --- */
        #lobby-screen { background: var(--clash-gradient); }
        .top-bar { display: flex; justify-content: space-around; background: rgba(0,0,0,0.7); padding: 10px 0; border-bottom: 3px solid #000; }
        .res { background: #000; border: 2px solid #555; padding: 5px 15px; border-radius: 20px; font-weight: bold; display: flex; align-items: center; gap: 5px; }

        .main-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .king-avatar { font-size: 100px; filter: drop-shadow(0 0 20px rgba(255,215,0,0.5)); }
        
        .battle-btn { 
            width: 220px; height: 65px; background: linear-gradient(#f39c12, #d35400); 
            border: 4px solid white; border-radius: 15px; color: white; font-size: 26px; 
            font-weight: bold; text-shadow: 2px 2px #000; cursor: pointer; transform: skew(-5deg);
        }

        /* --- MENÚ INFERIOR --- */
        .nav-bar { height: 75px; background: #2c3e50; display: flex; justify-content: space-around; align-items: center; border-top: 4px solid #000; }
        .nav-item { font-size: 28px; cursor: pointer; transition: 0.3s; opacity: 0.6; }
        .nav-item.active { opacity: 1; transform: scale(1.2); }

        /* --- CLANES Y CHAT (PEERJS) --- */
        #clan-panel { 
            position: absolute; bottom: 75px; width: 100%; height: 60%; 
            background: #1a1a1a; border-top: 4px solid var(--blue); 
            transform: translateY(100%); transition: 0.5s; z-index: 20; 
        }
        #clan-panel.open { transform: translateY(0); }
        #chat-box { height: 70%; overflow-y: auto; padding: 15px; background: #000; margin: 10px; border-radius: 10px; }

        /* --- ADMIN --- */
        #admin-tag { position: absolute; top: 70px; right: 10px; background: red; padding: 5px 10px; border-radius: 5px; font-size: 10px; cursor: pointer; display: none; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-screen" class="screen">
        <div class="auth-box">
            <h2 id="auth-title">HOLA, DESCONOCIDO</h2>
            <input type="text" id="user-nick" placeholder="Tu Nickname">
            <input type="email" id="user-email" placeholder="Gmail (Para Admin)">
            <input type="password" id="user-pass" placeholder="Password">
            <button class="battle-btn" style="width:100%; height:50px; font-size:18px;" onclick="doLogin()">ENTRAR</button>
        </div>
    </div>

    <div id="lobby-screen" class="screen hidden">
        <div class="top-bar">
            <div class="res">🏆 <span id="val-wins">0</span></div>
            <div class="res">💰 <span id="val-gold">0</span></div>
            <div class="res" style="border-color:#f0f">💧 <span id="val-elixir">10</span></div>
        </div>

        <div id="admin-tag" onclick="showAdminMenu()">⚙️ ADMIN PANEL</div>

        <div class="main-view">
            <h2 id="display-nick">NICKNAME</h2>
            <div class="king-avatar">🤴</div>
            <button class="battle-btn" onclick="alert('Buscando rival...')">¡BATALLA!</button>
        </div>

        <div id="clan-panel">
            <div style="padding:15px;">
                <h3>CHAT DE CLAN (Online)</h3>
                <div id="chat-box"></div>
                <div style="display:flex; gap:5px; padding:0 10px;">
                    <input type="text" id="msg-input" placeholder="Escribe al clan..." style="flex:1; margin:0;">
                    <button class="battle-btn" style="width:60px; height:45px; margin:0;" onclick="sendChat()">➤</button>
                </div>
                <p style="font-size:10px; color:gray; margin-left:15px;">ID para amigos: <b id="my-peer-id">...</b></p>
            </div>
        </div>

        <div class="nav-bar">
            <div class="nav-item">🛒</div>
            <div class="nav-item">🎴</div>
            <div class="nav-item active" onclick="toggleClan(false)">⚔️</div>
            <div class="nav-item" onclick="toggleClan(true)">🛡️</div>
            <div class="nav-item">🏆</div>
        </div>
    </div>

    <script>
        let userData = { nick: "", email: "", gold: 1000, wins: 0, pass: "" };
        let peer, connections = [];

        // --- SISTEMA DE CUENTA LOCAL ---
        function doLogin() {
            const email = document.getElementById('user-email').value;
            const nick = document.getElementById('user-nick').value;
            
            // Cargar si ya existe
            const saved = localStorage.getItem('clash_user_' + email);
            if(saved) {
                userData = JSON.parse(saved);
            } else {
                userData.email = email;
                userData.nick = nick;
                saveData();
            }

            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
            
            updateUI();
            initOnline();
        }

        function saveData() {
            localStorage.setItem('clash_user_' + userData.email, JSON.stringify(userData));
        }

        function updateUI() {
            document.getElementById('display-nick').innerText = userData.nick;
            document.getElementById('val-gold').innerText = userData.gold;
            document.getElementById('val-wins').innerText = userData.wins;
            
            if(userData.email === "milanbiel12@gmail.com") {
                document.getElementById('admin-tag').style.display = "block";
            }
        }

        // --- SISTEMA ONLINE (PEERJS) ---
        function initOnline() {
            // Usamos el nick como ID para que sea fácil encontrarse
            peer = new Peer(userData.nick.replace(/\s+/g, '-').toLowerCase());

            peer.on('open', (id) => {
                document.getElementById('my-peer-id').innerText = id;
                addMsg("Sistema", "Conectado al servidor de clanes.");
            });

            peer.on('connection', (conn) => {
                setupConn(conn);
            });
        }

        function setupConn(conn) {
            connections.push(conn);
            conn.on('data', (data) => {
                if(data.type === 'chat') addMsg(data.user, data.text);
                if(data.type === 'admin_gift') {
                    userData.gold += data.amt;
                    saveData();
                    updateUI();
                    addMsg("ADMIN", "Has recibido " + data.amt + " monedas.");
                }
            });
        }

        function sendChat() {
            const txt = document.getElementById('msg-input').value;
            if(!txt) return;
            addMsg("Tú", txt);
            connections.forEach(c => c.send({ type: 'chat', user: userData.nick, text: txt }));
            document.getElementById('msg-input').value = "";
        }

        function addMsg(user, text) {
            const box = document.getElementById('chat-box');
            box.innerHTML += `<div><b>${user}:</b> ${text}</div>`;
            box.scrollTop = box.scrollHeight;
        }

        // --- FUNCIONES LOBBY ---
        function toggleClan(show) {
            document.getElementById('clan-panel').classList.toggle('open', show);
        }

        // --- PANEL ADMIN ---
        function showAdminMenu() {
            const target = prompt("ID (Nick) del jugador a quien dar monedas:");
            const amt = parseInt(prompt("Cantidad de monedas:"));
            
            const conn = peer.connect(target.replace(/\s+/g, '-').toLowerCase());
            conn.on('open', () => {
                conn.send({ type: 'admin_gift', amt: amt });
                alert("Monedas enviadas a " + target);
            });
        }
    </script>
</body>
</html>
