<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Clash 3D - Elite Easy Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root { --gold: #FFD700; --elixir: #ff00ff; --blue: #2196F3; --red: #F44336; }
        body { margin: 0; overflow: hidden; font-family: 'Verdana', sans-serif; background: #000; color: white; user-select: none; }

        .screen {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle, #2c3e50, #000);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; transition: 0.5s;
        }
        .hidden { display: none !important; }

        .panel {
            background: rgba(0,0,0,0.9); padding: 30px; border-radius: 25px;
            border: 3px solid var(--gold); text-align: center; width: 450px;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
        }

        input {
            padding: 15px; width: 80%; border-radius: 12px; border: none;
            margin: 10px 0; font-size: 1.1rem; text-align: center; background: #222; color: white;
        }
        .btn {
            padding: 15px 30px; border-radius: 50px; border: none; cursor: pointer;
            font-weight: bold; text-transform: uppercase; margin: 8px; width: 90%;
            transition: 0.2s; box-shadow: 0 5px 0 rgba(0,0,0,0.4);
        }
        .btn-green { background: linear-gradient(#2ecc71, #27ae60); color: white; }
        .btn-blue { background: linear-gradient(#3498db, #2980b9); color: white; }

        /* HUD Y BARRAS DE VIDA */
        #game-ui { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
        .hp-bar-container {
            position: absolute; width: 50px; height: 6px; background: rgba(0,0,0,0.5);
            border: 1px solid #fff; border-radius: 3px; transform: translate(-50%, -50%);
        }
        .hp-bar-fill { height: 100%; width: 100%; transition: width 0.2s; }
        
        #hud-bottom {
            position: absolute; bottom: 0; width: 100%; height: 160px;
            background: linear-gradient(transparent, rgba(0,0,0,0.9));
            display: flex; flex-direction: column; align-items: center; pointer-events: auto;
        }
        #hand { display: flex; gap: 10px; margin-top: 10px; }
        .card {
            width: 75px; height: 100px; background: white; border-radius: 8px;
            color: black; border: 3px solid #444; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer; font-weight: bold;
        }

        /* ELIXIR DISPLAY */
        #elixir-wrapper { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        #elixir-num { font-size: 1.5rem; font-weight: bold; color: var(--elixir); text-shadow: 0 0 10px #000; }
        #elixir-container { width: 300px; height: 16px; background: #111; border: 2px solid #fff; border-radius: 10px; overflow: hidden; }
        #elixir-fill { height: 100%; width: 0%; background: var(--elixir); }

        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-height: 250px; overflow-y: auto; padding: 10px; }
        .item-card { background: #333; padding: 10px; border-radius: 10px; cursor: pointer; border: 2px solid transparent; }
        .item-card.active { border-color: var(--gold); background: #443300; }
    </style>
</head>
<body>

    <div id="screen-login" class="screen">
        <div class="panel">
            <h1>MINI CLASH <span style="color:var(--gold)">3D</span></h1>
            <p>Introduce tu nombre (Datos guardados):</p>
            <input type="text" id="username" placeholder="Nombre..." maxlength="12">
            <button class="btn btn-green" onclick="initSession()">ENTRAR AL LOBBY</button>
        </div>
    </div>

    <div id="screen-lobby" class="screen hidden">
        <div class="panel" style="width: 600px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px;">
                <span>💰 <b id="stat-gold">0</b></span>
                <span id="display-user" style="color:var(--gold); font-weight:bold;"></span>
                <span>🏆 <b id="stat-wins">0</b></span>
            </div>
            
            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <h3>TIENDA</h3>
                    <div id="shop-grid" class="grid"></div>
                </div>
                <div style="flex: 1;">
                    <h3>TU MAZO (4)</h3>
                    <div id="deck-grid" class="grid"></div>
                </div>
            </div>

            <div style="margin-top: 20px; background: #222; padding: 10px; border-radius: 15px;">
                <input type="text" id="friend-id" placeholder="Nombre de tu amigo..." style="width: 50%; padding: 10px;">
                <button class="btn btn-blue" style="width: 40%;" onclick="connectToFriend()">INVITAR ONLINE</button>
            </div>
            <button class="btn btn-green" onclick="startSoloGame()">MODO FÁCIL (IA)</button>
        </div>
    </div>

    <div id="game-ui" class="hidden">
        <div id="hp-bars-layer"></div>
        <div id="hud-bottom">
            <div id="elixir-wrapper">
                <div id="elixir-num">0</div>
                <div id="elixir-container"><div id="elixir-fill"></div></div>
            </div>
            <div id="hand"></div>
        </div>
    </div>

<script>
let player = { name: "", gold: 1000, wins: 0, owned: [0, 1, 2, 3], deck: [0, 1, 2, 3] };

function saveGame() { if(player.name) localStorage.setItem('clash_save_v2_' + player.name, JSON.stringify(player)); }
function loadGame(name) {
    const data = localStorage.getItem('clash_save_v2_' + name);
    if(data) player = JSON.parse(data);
    else player = { name: name, gold: 1000, wins: 0, owned: [0,1,2,3], deck: [0,1,2,3] };
}

const CHARS_DB = [];
const types = ["Guerrero", "Arquero", "Gigante", "Mago", "Caballero", "Bárbaro"];
const icons = ["⚔️", "🏹", "🧔", "🔥", "🛡️", "🪓"];
for(let i=0; i<50; i++) {
    const t = i % types.length;
    CHARS_DB.push({
        id: i, name: types[t], emoji: icons[t],
        hp: 120 + (i*15), dmg: 25 + (i*5), cost: 2 + (i%4), speed: 2 + Math.random(),
        price: i * 200, color: new THREE.Color().setHSL((i*0.13)%1, 0.7, 0.5).getHex()
    });
}

let peer, conn, isMultiplayer = false;

function initSession() {
    const name = document.getElementById('username').value.trim();
    if(!name) return alert("Escribe un nombre");
    loadGame(name);
    peer = new Peer(name);
    peer.on('open', () => {
        document.getElementById('screen-login').classList.add('hidden');
        document.getElementById('screen-lobby').classList.remove('hidden');
        document.getElementById('display-user').innerText = name;
        updateLobbyUI();
    });
    peer.on('connection', c => { conn = c; setupConn(); });
}

function setupConn() {
    isMultiplayer = true;
    conn.on('open', () => startMatch());
    conn.on('data', data => {
        if(data.type === 'spawn') spawnUnit(data.id, 'enemy', data.z, false);
        if(data.type === 'tower_hp') towers.player.hp = data.hp;
    });
}

function connectToFriend() {
    const fid = document.getElementById('friend-id').value.trim();
    conn = peer.connect(fid);
    setupConn();
}

/* --- MOTOR 3D --- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3d7a35);
const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 24, 22); camera.lookAt(0, -2, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const ambient = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(10, 25, 10); sun.castShadow = true;
scene.add(ambient, sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(42, 24), new THREE.MeshStandardMaterial({color: 0x4aa144}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true;
scene.add(ground);

function createDetailedCharacter(config, owner) {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({color: config.color, metalness: 0.4});
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.4, 0.5, 4, 8), mat);
    body.position.y = 0.6; body.castShadow = true;
    const helmet = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 0.4, 8), new THREE.MeshStandardMaterial({color: 0x444444, metalness: 0.8}));
    helmet.position.y = 1.1;
    const weapon = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.8, 0.1), new THREE.MeshStandardMaterial({color: 0xdddddd, metalness: 0.9}));
    weapon.position.set(0.6, 0.6, 0.2);
    group.add(body, helmet, weapon);
    return group;
}

let towers = { player: null, enemy: null }, troops = [], gameActive = false, elixir = 0;

function createTower(x, color, isPlayer) {
    const group = new THREE.Group();
    const base = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.8, 4, 8), new THREE.MeshStandardMaterial({color: 0x7f8c8d}));
    const top = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1, 2.2), new THREE.MeshStandardMaterial({color: color}));
    top.position.y = 2.5; base.castShadow = true;
    group.add(base, top); group.position.set(x, 2, 0);
    scene.add(group);
    
    const bar = document.createElement('div');
    bar.className = 'hp-bar-container';
    bar.innerHTML = `<div class="hp-bar-fill" style="background:${isPlayer ? 'var(--blue)' : 'var(--red)'}"></div>`;
    document.getElementById('hp-bars-layer').appendChild(bar);

    // DIFICULTAD: Jugador 5000 HP, Enemigo 2000 HP
    return { mesh: group, hp: isPlayer ? 5000 : 2000, maxHp: isPlayer ? 5000 : 2000, bar, x };
}

function startMatch() {
    document.getElementById('screen-lobby').classList.add('hidden');
    document.getElementById('game-ui').classList.remove('hidden');
    document.getElementById('hp-bars-layer').innerHTML = '';
    
    troops.forEach(t => { scene.remove(t.mesh); if(t.bar) t.bar.remove(); });
    troops = [];
    if(towers.player) scene.remove(towers.player.mesh);
    if(towers.enemy) scene.remove(towers.enemy.mesh);

    towers.player = createTower(-16, 0x2196F3, true);
    towers.enemy = createTower(16, 0xF44336, false);
    
    gameActive = true; elixir = 5;
    renderHand();
    animate();
}

function startSoloGame() { isMultiplayer = false; startMatch(); }

function spawnUnit(id, owner, z, sync) {
    const c = CHARS_DB[id];
    const mesh = createDetailedCharacter(c, owner);
    mesh.position.set(owner === 'player' ? -14 : 14, 0, z);
    scene.add(mesh);

    const bar = document.createElement('div');
    bar.className = 'hp-bar-container';
    bar.innerHTML = `<div class="hp-bar-fill" style="background:${owner === 'player' ? 'var(--blue)' : 'var(--red)'}"></div>`;
    document.getElementById('hp-bars-layer').appendChild(bar);

    // DIFICULTAD: El jugador hace 1.5x de daño
    troops.push({ ...c, owner, mesh, bar, hp: c.hp, maxHp: c.hp, currentDmg: (owner==='player' ? c.dmg*1.5 : c.dmg) });
    if(sync && isMultiplayer && conn) conn.send({type:'spawn', id, z});
}

function updateLobbyUI() {
    document.getElementById('stat-gold').innerText = player.gold;
    document.getElementById('stat-wins').innerText = player.wins;
    const shop = document.getElementById('shop-grid'); shop.innerHTML = '';
    CHARS_DB.forEach(c => {
        const owned = player.owned.includes(c.id);
        const div = document.createElement('div');
        div.className = `item-card ${owned ? 'active' : ''}`;
        div.innerHTML = `<div>${c.emoji}</div><small>${owned ? 'LISTO' : '💰'+c.price}</small>`;
        div.onclick = () => { if(!owned && player.gold >= c.price) { player.gold -= c.price; player.owned.push(c.id); saveGame(); updateLobbyUI(); }};
        shop.appendChild(div);
    });
    const deck = document.getElementById('deck-grid'); deck.innerHTML = '';
    player.owned.forEach(id => {
        const c = CHARS_DB[id];
        const inDeck = player.deck.includes(id);
        const div = document.createElement('div');
        div.className = `item-card ${inDeck ? 'active' : ''}`;
        div.innerHTML = `<div>${c.emoji}</div><small>${inDeck ? 'MAZO' : 'USAR'}</small>`;
        div.onclick = () => { if(!inDeck) { if(player.deck.length >= 4) player.deck.shift(); player.deck.push(id); saveGame(); updateLobbyUI(); }};
        deck.appendChild(div);
    });
}

function renderHand() {
    const h = document.getElementById('hand'); h.innerHTML = '';
    player.deck.forEach(id => {
        const c = CHARS_DB[id];
        const d = document.createElement('div');
        d.className = 'card';
        d.innerHTML = `<span style="color:var(--elixir)">💧${c.cost}</span><div style="font-size:1.5rem">${c.emoji}</div>`;
        d.onclick = () => { if(elixir >= c.cost) { spawnUnit(id, 'player', (Math.random()-0.5)*8, true); elixir -= c.cost; }};
        h.appendChild(d);
    });
}

function animate() {
    if(!gameActive) return;
    requestAnimationFrame(animate);
    const dt = 0.016;

    elixir = Math.min(10, elixir + dt * 0.7);
    document.getElementById('elixir-fill').style.width = (elixir * 10) + "%";
    document.getElementById('elixir-num').innerText = Math.floor(elixir);

    // IA ENEMIGA (Dificultad fácil: menos frecuencia)
    if(!isMultiplayer && Math.random() < 0.0035) spawnUnit(Math.floor(Math.random()*6), 'enemy', (Math.random()-0.5)*8, false);

    for(let i = troops.length-1; i>=0; i--) {
        const t = troops[i];
        if(t.hp <= 0) { scene.remove(t.mesh); t.bar.remove(); troops.splice(i,1); continue; }

        let target = null, minDist = 5;
        troops.forEach(e => { if(e.owner !== t.owner) { let d = t.mesh.position.distanceTo(e.mesh.position); if(d < minDist) { minDist = d; target = e; }}});

        if(target) {
            if(minDist < 1.2) target.hp -= t.currentDmg * dt;
            else move(t, target.mesh.position, dt);
        } else {
            const tow = t.owner === 'player' ? towers.enemy : towers.player;
            if(Math.abs(t.mesh.position.x - tow.x) < 2) {
                tow.hp -= (t.currentDmg*0.5)*dt;
                if(isMultiplayer && conn) conn.send({type:'tower_hp', hp: towers.enemy.hp});
            } else move(t, new THREE.Vector3(tow.x, 0, 0), dt);
        }
        updateBar(t.mesh.position, t.bar, t.hp/t.maxHp);
    }

    updateBar(towers.player.mesh.position, towers.player.bar, towers.player.hp/towers.player.maxHp);
    updateBar(towers.enemy.mesh.position, towers.enemy.bar, towers.enemy.hp/towers.enemy.maxHp);

    if(towers.enemy.hp <= 0) endMatch(true);
    if(towers.player.hp <= 0) endMatch(false);

    renderer.render(scene, camera);
}

function move(t, pos, dt) {
    const dir = new THREE.Vector3().subVectors(pos, t.mesh.position).normalize();
    t.mesh.position.add(dir.multiplyScalar(t.speed * dt));
    t.mesh.lookAt(pos.x, 0, pos.z);
    t.mesh.position.y = Math.abs(Math.sin(Date.now()*0.01*t.speed))*0.12;
}

function updateBar(pos3d, bar, pct) {
    const v = pos3d.clone().project(camera);
    bar.style.left = (v.x * 0.5 + 0.5) * window.innerWidth + "px";
    bar.style.top = (-(v.y * 0.5 - 0.5) * window.innerHeight) - 40 + "px";
    bar.firstChild.style.width = Math.max(0, pct * 100) + "%";
}

function endMatch(win) {
    gameActive = false;
    alert(win ? "¡VICTORIA REAL! +500 Oro" : "DERROTA");
    if(win) { player.gold += 500; player.wins++; saveGame(); }
    document.getElementById('game-ui').classList.add('hidden');
    document.getElementById('screen-lobby').classList.remove('hidden');
    updateLobbyUI();
}
</script>
</body>
</html>
